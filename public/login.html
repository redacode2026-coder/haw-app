<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول — حزب حُماة الوطن</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:        #0d1b3e;
      --navy-deep:   #060e22;
      --navy-mid:    #122050;
      --gold:        #c9a84c;
      --gold-light:  #e2c97e;
      --gold-dim:    #8a6a2a;
      --white:       #ffffff;
      --off-white:   #f4f1e8;
      --text-muted:  rgba(255,255,255,0.55);
      --border:      rgba(201,168,76,0.25);
      --input-bg:    rgba(255,255,255,0.06);
      --input-focus: rgba(201,168,76,0.15);
      --error:       #e74c3c;
      --success:     #27ae60;
    }

    html, body {
      height: 100%;
      font-family: 'Cairo', sans-serif;
    }

    body {
      background: var(--navy-deep);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* ---- Animated background ---- */
    .bg-layer {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 80% 60% at 60% 0%, rgba(201,168,76,0.12) 0%, transparent 65%),
        radial-gradient(ellipse 60% 80% at 10% 90%, rgba(18,32,80,0.9) 0%, transparent 60%),
        linear-gradient(160deg, #060e22 0%, #0d1b3e 55%, #060e22 100%);
    }
    .bg-orb {
      position: fixed; border-radius: 50%; filter: blur(80px); opacity: 0.18; z-index: 0;
      animation: floatOrb 8s ease-in-out infinite alternate;
    }
    .bg-orb.o1 { width: 400px; height: 400px; background: var(--gold); top: -100px; right: -100px; animation-delay: 0s; }
    .bg-orb.o2 { width: 300px; height: 300px; background: #2a4caa; bottom: -80px; left: -60px; animation-delay: 3s; }
    .bg-orb.o3 { width: 200px; height: 200px; background: var(--gold-dim); top: 50%; left: 30%; animation-delay: 1.5s; }
    @keyframes floatOrb { from { transform: translate(0,0) scale(1); } to { transform: translate(20px, 30px) scale(1.1); } }

    /* ---- Login Card ---- */
    .login-card {
      position: relative; z-index: 10;
      background: rgba(13,27,62,0.75);
      backdrop-filter: blur(24px) saturate(1.4);
      -webkit-backdrop-filter: blur(24px) saturate(1.4);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 48px 44px 40px;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(201,168,76,0.08) inset;
      animation: cardIn 0.5s cubic-bezier(0.22,1,0.36,1) both;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(32px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ---- Logo / Header ---- */
    .logo-wrap {
      text-align: center;
      margin-bottom: 32px;
    }
    .logo-img {
      width: 80px; height: 80px;
      border-radius: 50%;
      border: 2.5px solid var(--gold);
      object-fit: cover;
      margin-bottom: 14px;
      box-shadow: 0 0 24px rgba(201,168,76,0.3);
    }
    .logo-title {
      font-size: 1.45rem;
      font-weight: 800;
      color: var(--gold-light);
      letter-spacing: -0.3px;
      margin-bottom: 4px;
    }
    .logo-sub {
      font-size: 0.82rem;
      color: var(--text-muted);
      letter-spacing: 0.2px;
    }
    .divider {
      height: 1px;
      background: linear-gradient(to right, transparent, var(--border), transparent);
      margin: 24px 0;
    }

    /* ---- Form ---- */
    .form-label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--gold-light);
      margin-bottom: 7px;
      letter-spacing: 0.2px;
    }
    .input-wrap {
      position: relative;
      margin-bottom: 18px;
    }
    .input-wrap .icon {
      position: absolute;
      right: 14px; top: 50%; transform: translateY(-50%);
      font-size: 1rem;
      color: var(--text-muted);
      pointer-events: none;
      transition: color 0.2s;
    }
    .input-wrap input {
      width: 100%;
      background: var(--input-bg);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 13px 44px 13px 44px;
      font-family: 'Cairo', sans-serif;
      font-size: 0.95rem;
      color: var(--white);
      outline: none;
      transition: border-color 0.22s, background 0.22s, box-shadow 0.22s;
      direction: rtl;
    }
    .input-wrap input::placeholder { color: var(--text-muted); }
    .input-wrap input:focus {
      border-color: var(--gold);
      background: var(--input-focus);
      box-shadow: 0 0 0 3px rgba(201,168,76,0.12);
    }
    .input-wrap input:focus + .icon,
    .input-wrap:focus-within .icon { color: var(--gold); }

    .input-wrap .toggle-pw {
      position: absolute;
      left: 14px; top: 50%; transform: translateY(-50%);
      background: none; border: none;
      color: var(--text-muted);
      font-size: 1rem;
      cursor: pointer;
      padding: 4px;
      transition: color 0.2s;
    }
    .input-wrap .toggle-pw:hover { color: var(--gold-light); }

    .remember-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 22px;
    }
    .remember-row input[type="checkbox"] {
      width: 17px; height: 17px;
      accent-color: var(--gold);
      cursor: pointer;
    }
    .remember-row label {
      font-size: 0.85rem;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
    }

    /* ---- Button ---- */
    .btn-login {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dim) 100%);
      color: var(--navy-deep);
      font-family: 'Cairo', sans-serif;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      letter-spacing: 0.3px;
      transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
      box-shadow: 0 4px 20px rgba(201,168,76,0.3);
      position: relative; overflow: hidden;
    }
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(201,168,76,0.4);
      filter: brightness(1.07);
    }
    .btn-login:active { transform: translateY(0); }
    .btn-login:disabled {
      opacity: 0.6; cursor: not-allowed; transform: none;
    }
    .btn-login .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2.5px solid rgba(6,14,34,0.4);
      border-top-color: var(--navy-deep);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-left: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---- Error message ---- */
    .login-error {
      background: rgba(231,76,60,0.1);
      border: 1px solid rgba(231,76,60,0.35);
      border-radius: 10px;
      padding: 11px 14px;
      color: #ff8a80;
      font-size: 0.87rem;
      margin-bottom: 16px;
      display: none;
      animation: shakeX 0.4s ease;
    }
    .login-error.show { display: block; }
    @keyframes shakeX {
      0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)}
      60%{transform:translateX(-4px)} 80%{transform:translateX(4px)}
    }

    /* ---- Quick role cards ---- */
    .quick-access {
      margin-top: 28px;
    }
    .quick-label {
      font-size: 0.78rem;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 12px;
    }
    .role-cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .role-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, transform 0.15s;
      text-align: right;
    }
    .role-card:hover {
      background: rgba(201,168,76,0.08);
      border-color: rgba(201,168,76,0.4);
      transform: translateY(-1px);
    }
    .role-card .rc-name {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--white);
      display: block;
    }
    .role-card .rc-cred {
      font-size: 0.73rem;
      color: var(--text-muted);
      display: block;
      margin-top: 2px;
    }
    .rc-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 0.65rem;
      font-weight: 700;
      margin-bottom: 5px;
    }
    .badge-admin    { background: rgba(201,168,76,0.2); color: var(--gold-light); border: 1px solid rgba(201,168,76,0.3); }
    .badge-editor   { background: rgba(52,152,219,0.2); color: #7ec8f5; border: 1px solid rgba(52,152,219,0.3); }
    .badge-reviewer { background: rgba(46,204,113,0.2); color: #7de8a8; border: 1px solid rgba(46,204,113,0.3); }
    .badge-viewer   { background: rgba(155,89,182,0.2); color: #c8a5e8; border: 1px solid rgba(155,89,182,0.3); }

    .footer-note {
      text-align: center;
      font-size: 0.73rem;
      color: rgba(255,255,255,0.25);
      margin-top: 28px;
    }

    @media (max-width: 480px) {
      .login-card { padding: 36px 22px 28px; margin: 16px; }
      .role-cards { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="bg-layer"></div>
  <div class="bg-orb o1"></div>
  <div class="bg-orb o2"></div>
  <div class="bg-orb o3"></div>

  <div class="login-card" role="main">
    <div class="logo-wrap">
      <img src="assets/badge.jpg" alt="شعار حزب حماة الوطن" class="logo-img" onerror="this.style.display='none'">
      <div class="logo-title">حزب حُماة الوطن</div>
      <div class="logo-sub">أمانة محافظة البحيرة — منظومة إدارة العضوية</div>
    </div>

    <div class="divider"></div>

    <form id="login-form" autocomplete="off" novalidate>
      <div class="login-error" id="login-error" role="alert"></div>

      <label class="form-label" for="inp-username">اسم المستخدم</label>
      <div class="input-wrap">
        <input type="text" id="inp-username" name="username"
               placeholder="أدخل اسم المستخدم" autocomplete="username" required>
        <span class="icon">👤</span>
      </div>

      <label class="form-label" for="inp-password">كلمة المرور</label>
      <div class="input-wrap">
        <input type="password" id="inp-password" name="password"
               placeholder="أدخل كلمة المرور" autocomplete="current-password" required>
        <span class="icon">🔒</span>
        <button type="button" class="toggle-pw" id="toggle-pw" title="إظهار / إخفاء كلمة المرور" aria-label="إظهار كلمة المرور">
          👁
        </button>
      </div>

      <div class="remember-row">
        <input type="checkbox" id="remember-me" name="remember">
        <label for="remember-me">تذكّر تسجيل الدخول</label>
      </div>

      <button type="submit" class="btn-login" id="btn-submit">
        تسجيل الدخول
      </button>
    </form>

    <p class="footer-note">جميع الحقوق محفوظة © 2026 — حزب حُماة الوطن</p>
  </div>

  <script>
    // Toggle password visibility
    const pwInput  = document.getElementById('inp-password');
    const togglePw = document.getElementById('toggle-pw');
    togglePw.addEventListener('click', () => {
      const show = pwInput.type === 'password';
      pwInput.type = show ? 'text' : 'password';
      togglePw.textContent = show ? '🙈' : '👁';
    });

    function showError(msg) {
      const el = document.getElementById('login-error');
      el.textContent = msg;
      el.classList.add('show');
    }
    function hideError() {
      document.getElementById('login-error').classList.remove('show');
    }

    function setLoading(on) {
      const btn = document.getElementById('btn-submit');
      btn.disabled = on;
      btn.innerHTML = on
        ? 'جارٍ التحقق... <span class="spinner"></span>'
        : 'تسجيل الدخول';
    }

    async function doLogin(username, password, remember) {
      hideError();
      setLoading(true);
      try {
        const res  = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (!data.success) {
          showError(data.error || 'اسم المستخدم أو كلمة المرور غير صحيحة');
          setLoading(false);
          return;
        }
        // Save token
        const storage = remember ? localStorage : sessionStorage;
        storage.setItem('haw_token', data.token);
        storage.setItem('haw_user',  JSON.stringify(data.user));
        // Redirect to main app
        window.location.href = 'index.html';
      } catch (err) {
        showError('تعذّر الاتصال بالخادم، يرجى إعادة المحاولة');
        setLoading(false);
      }
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('inp-username').value.trim();
      const password = document.getElementById('inp-password').value;
      const remember = document.getElementById('remember-me').checked;
      if (!username || !password) {
        showError('يرجى إدخال اسم المستخدم وكلمة المرور');
        return;
      }
      await doLogin(username, password, remember);
    });

    function quickLogin(user, pass) {
      document.getElementById('inp-username').value = user;
      document.getElementById('inp-password').value = pass;
      doLogin(user, pass, false);
    }

    // If already logged in, redirect
    (function checkExisting() {
      const token = localStorage.getItem('haw_token') || sessionStorage.getItem('haw_token');
      if (token) {
        fetch('/api/auth/me', { headers: { 'Authorization': 'Bearer ' + token } })
          .then(r => r.json())
          .then(d => { if (d.success) window.location.href = 'index.html'; })
          .catch(() => {});
      }
    })();
  </script>
</body>
</html>
